<!DOCTYPE html>
<html lang="en">
<head>
  <title>ReportingObserver demo: Deprecation report</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    video {
      display: block;
      border: 2px solid black;
      margin: 0 auto;
    }

  </style>
</head>
<body>
  <main>
    <h1>Deprecation report walkthrough</h1>
    <p>Use the button to display deprecation reports collected by this page.</p>
  <video controls>
    <p>Video not supported in your browser.</p>
  </video>

  <button type="button">Show reports</button>

  <div class="output" aria-live="polite"></div>
  </main>

  <script>
    // Get reference to button
    const reportBtn = document.querySelector('button');

    const observedReports = [];

    function displayReports() {
      const outputElem = document.querySelector('.output');
      outputElem.replaceChildren();
      const reports = [...observer.takeRecords(), ...observedReports];
      if (reports.length === 0) {
        outputElem.textContent = 'No deprecation reports have been observed yet.';
        return;
      }
      const list = document.createElement('ul');
      outputElem.appendChild(list);

      for(let i = 0; i < reports.length; i++) {
        let listItem = document.createElement('li');
        let textNode = document.createTextNode('Report ' + (i + 1) + ', type: ' + reports[i].type);
        listItem.appendChild(textNode);
        let innerList = document.createElement('ul');
        listItem.appendChild(innerList);
        list.appendChild(listItem);

        for (let key in reports[i].body) {
          let innerListItem = document.createElement('li');
          let keyValue = reports[i].body[key];
          innerListItem.textContent = key + ': ' + keyValue;
          innerList.appendChild(innerListItem);
        }
      }
    }

    // Set up reporting observer
    const options = {
      types: ['deprecation'],
      buffered: true
    };

    if (typeof ReportingObserver === 'function') {
      var observer = new ReportingObserver((reports) => observedReports.push(...reports), options);
      observer.observe();
    } else {
      reportBtn.disabled = true;
      document.querySelector('.output').textContent = 'ReportingObserver is not supported in this browser.';
    }
    reportBtn.addEventListener('click', displayReports);

    // try to use old-style getUserMedia
    const videoElem = document.querySelector('video');

    const constraints = {
      audio: true,
      video: {
        width: 480,
        height: 320
      }
    }

    // Keep the legacy call behind feature detection. It is only used to create
    // a deprecation report and must not prevent the report viewer from working.
    const legacyGetUserMedia = navigator.mozGetUserMedia ?? navigator.getUserMedia;
    if (typeof legacyGetUserMedia === 'function') {
      try {
        legacyGetUserMedia.call(navigator, constraints, () => {}, () => {});
      } catch {
        // Permission denial is expected when the demo is not served from a
        // secure context or the user has not granted camera access.
      }
    }
  </script>

</body>
</html>

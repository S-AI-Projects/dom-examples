<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MediaQueryList example</title>
    <style>
      html {
        font-family: sans-serif;
        background-color: white;
      }

      body {
        padding: 20px;
        margin: 10px;
        background-color: blue;
        border: 10px solid black;
      }

      h1,
      p {
        text-align: center;
      }

      p {
        font-size: 1.3rem;
      }
    </style>
  </head>
  <body>
    <h1>matchMedia test</h1>

      <p id="feature-status" role="status" aria-live="polite"></p>

    <script>
      var para = document.querySelector("p");
      if (typeof window.matchMedia !== "function") {
        para.textContent = "Media queries are unavailable in this browser. The example content remains available.";
        document.body.style.backgroundColor = "#e5e5e5";
      } else {
        var mql = window.matchMedia("(max-width: 600px)");

        function screenTest(e) {
          if (e.matches) {
            para.textContent = "This is a narrow screen — less than 600px wide.";
            document.body.style.backgroundColor = "red";
          } else {
            para.textContent = "This is a wide screen — more than 600px wide.";
            document.body.style.backgroundColor = "blue";
          }
        }

        screenTest(mql);
        mql.addEventListener("change", screenTest, false);
      }
    </script>
  </body>
</html>

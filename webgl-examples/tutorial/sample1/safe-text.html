<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Safe text rendering example</title>
    <script src="safe-text.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Render supplied text safely</h1>
      <label for="text-input">Text to display</label>
      <input id="text-input" type="text" />
      <button type="button" id="render-text">Render text</button>
      <p id="text-output" aria-live="polite"></p>
    </main>
  </body>
</html>

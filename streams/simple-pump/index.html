
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Stream Pump</title>
</head>
<body>
    <h1>Simple Stream Pump</h1>

    <p>
        The left tortoise is the original, the right one is
        created using a custom stream.
    </p>

    <img
        src="tortoise.png"
        width="150"
        height="84"
        alt="Tortoise Original"
    >

    <img
        src="."
        width="150"
        height="84"
        alt="Tortoise Copy"
        id="target"
    >

    <p id="status" role="status" hidden></p>

    <script>
        const image = document.getElementById('target');
        const status = document.getElementById('status');

        // Check whether the required browser features are available.
        const streamsSupported =
            typeof ReadableStream === 'function' &&
            typeof fetch === 'function' &&
            typeof Response === 'function' &&
            typeof URL.createObjectURL === 'function';

        if (!streamsSupported) {
            image.hidden = true;
            status.hidden = false;
            status.textContent =
                'This browser does not support the Streams API required for this example.';
        } else {
            async function pumpImage() {
                let reader;

                try {
                    const response = await fetch('./tortoise.png');

                    if (!response.ok || !response.body) {
                        throw new Error('Unable to fetch the original image.');
                    }

                    reader = response.body.getReader();

                    const stream = new ReadableStream({
                        async start(controller) {
                            try {
                                while (true) {
                                    const { done, value } = await reader.read();

                                    if (done) {
                                        break;
                                    }

                                    controller.enqueue(value);
                                }

                                controller.close();
                            } catch (error) {
                                controller.error(error);
                            } finally {
                                reader.releaseLock();
                            }
                        }
                    });

                    const streamedResponse = new Response(stream);
                    const blob = await streamedResponse.blob();
                    const url = URL.createObjectURL(blob);

                    image.src = url;
                } catch (error) {
                    status.hidden = false;
                    status.textContent =
                        'The tortoise copy could not be loaded. Please try again.';
                    console.error('Stream pump failed:', error);
                }
            }

            pumpImage();
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Cross-document view transition example: Page 1</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <p><a href="page2.html">Go to page 2</a></p>
  <img src="images/image1.jpg" alt="A suspension bridge spanning a river, with a cityscape on the other side.">
  <div id="view-transition-support" role="status" aria-live="polite">Checking view-transition support...</div>
  <script>
    const supportMessage = document.querySelector('#view-transition-support');
    supportMessage.textContent = CSS.supports('view-transition-name: root')
      ? 'Cross-document view transitions enabled.'
      : 'Cross-document view transitions are not supported; navigation still works normally.';
  </script>
</body>

</html>

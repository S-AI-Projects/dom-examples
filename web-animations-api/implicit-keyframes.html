<!doctype html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <title>Web Animations API implicit keyframes</title>
  <style>
    html {
      height: 100%;
    }

    body {
      margin: 0;
      height: inherit;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    div {
      width: 150px;
      height: 100px;
      background-color: red;
      border: 10px solid black;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div>

  </div>
  <p id="animation-status" role="status" aria-live="polite">
    Animation is running.
  </p>

  <script>
    const divElem = document.querySelector('div');
    const statusElem = document.querySelector('#animation-status');

    let rotate360 = [
      { transform: 'rotate(360deg)' }
    ];

    let slowInfinite = {
      duration: 5000,
      iterations: Infinity
    }

    if (typeof divElem.animate === 'function') {
      divElem.animate( rotate360, slowInfinite );
    } else {
      statusElem.textContent = 'Web Animations API is not supported in this browser.';
    }

  </script>
</body>

</html>

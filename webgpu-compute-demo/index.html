<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU data</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        color: #222;
        background: #fff;
      }
      .content-region {
        max-width: 100%;
        margin: 0 auto;
      }
      h1 {
        margin-top: 0;
        word-break: break-word;
      }
      #status {
        padding: 8px 12px;
        background: #eef2f7;
        border-radius: 4px;
        font-weight: 500;
      }
      .scrollable-output {
        max-width: 100%;
        overflow-x: auto;
        padding: 12px;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-family: monospace;
        font-size: 14px;
        white-space: pre;
      }
      .scrollable-output:focus-visible {
        outline: 2px solid #0969da;
        outline-offset: 2px;
      }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main id="main-content" class="content-region">
      <h1>WebGPU data</h1>
      <p id="status">Initializing WebGPU...</p>
      <section aria-labelledby="output-heading">
        <h2 id="output-heading" style="font-size: 1.1rem;">Computed Buffer Data:</h2>
        <pre id="output-container" class="scrollable-output" tabindex="0" aria-label="WebGPU computed buffer data"><code id="output-code">Waiting for compute shader...</code></pre>
      </section>
    </main>
  </body>
</html>
